# VTCAIO — Full stack (dev demo + Prod single-node).
#
# Demo trên laptop (không cần multicast, dùng file mẫu):
#   docker compose --profile demo up --build
#   docker compose exec tsduck sh /work/scripts/demo-cli.sh
#
# Prod single-node (bắt multicast thật, xem docs/11-DEPLOY.md trước):
#   1. sh scripts/prod-check.sh            # kernel + mount + IP
#   2. sudo mount tmpfs /media/ramdisk/live (scripts/mount-ramdisk.sh)
#   3. cp .env.prod.example .env.prod rồi điền secret
#   4. docker compose --profile prod up -d --build
#
# Backend chạy network_mode:host để tsp con kế thừa namespace và bắt
# multicast trực tiếp từ switch (PRD §11). Đánh đổi: port 18080 chiếm trên host
# (không dùng 8080 vì trùng dashboard Traefik khi chạy cùng Coolify).

services:
  #-- Dev: vọc TSDuck CLI/plugin đúng cách ------------------------------------
  tsduck:
    build:
      context: .
      dockerfile: docker/Dockerfile.tsduck
    image: vtc-tsduck:22.04
    container_name: vtc-tsduck
    init: true # tini thu dọn orphan — chống Zombie khi fork con mồ côi
    command: ["sleep", "infinity"]
    volumes:
      - ./storage/ramdisk:/media/ramdisk/live
      - ./storage/captures:/mnt/Data/catchup/captures
      - ./storage/exports:/mnt/Data/catchup/exports
      - ./storage/conf:/opt/vtc/conf/sources
      - ./scripts:/work/scripts
      - ./plugins:/work/plugins
    profiles: ["demo", "tsduck"]
    # network_mode: "host"  # Bật khi test multicast thật ở LAN

  #-- Dev: Nginx mini serve ./storage/ramdisk để xem HLS ở :8081 ---------------
  # (next dev không serve /hls — cần static server này khi demo Live local).
  demo-hls:
    image: nginx:1.27-alpine
    container_name: vtc-demo-hls
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/ramdisk:/media/ramdisk/live:ro
    profiles: ["demo"]

  #-- Prod: backend (Node + tsp cùng container, host network) -----------------
  # Backend ở host network nên KHÔNG thấy DNS compose: frontend/nginx gọi nó
  # qua host.docker.internal (cần extra_hosts bên dưới).
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: vtc-backend:latest
    container_name: vtc-backend
    init: true
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env.prod
        required: false # thiếu thì dùng default dev (có WARN trong log)
    environment:
      PORT: "18080"
      VTC_GC_ENABLE: "1"
    volumes:
      - ramdisk:/media/ramdisk/live
      - captures:/mnt/Data/catchup/captures
      - exports:/mnt/Data/catchup/exports
      - tspconf:/opt/vtc/conf/sources
    restart: unless-stopped
    profiles: ["prod"]

  #-- Prod: frontend Next.js ---------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: vtc-frontend:latest
    container_name: vtc-frontend
    init: true
    environment:
      VTC_API_ORIGIN: "http://host.docker.internal:18080"
    restart: unless-stopped
    profiles: ["prod"]

  #-- Prod: Nginx cửa vào duy nhất (:80) ---------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: vtc-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ramdisk:/media/ramdisk/live:ro
      - exports:/mnt/Data/catchup/exports:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  ramdisk: # Prod mount tmpfs đè lên (xem scripts/mount-ramdisk.sh)
  captures: # Prod bind HDD/SAN (compose.override.yml)
  exports:
  tspconf:
